[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightre"
version = "0.2.0"
description = "ARM64 SO analysis, source recovery and agent execution tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "markdown-it-py>=3,<5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
]

[project.scripts]
lightre = "lightre.server:main"
lightre-rehost = "lightre.rehost_cli:main"

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.md", "**/*.md"]
lightre = ["resources/*"]
analyzers = ["ghidra_scripts/*.java"]
rehost = ["workflows/unidbg/*.xml", "knowledge/*.md"]
webui = ["index.html", "static/*"]
