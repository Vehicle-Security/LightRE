[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightre"
version = "0.2.0"
description = "ARM64 SO analysis, source recovery and agent execution tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "markdown-it-py>=3,<5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
]

[project.scripts]
lightre = "lightre.cli:main"
lightre-agent = "lightre.cli.agent:main"
lightre-analyze = "lightre.cli.analyze:main"
lightre-harness = "lightre.cli.harness:main"
lightre-rehost = "lightre.cli.rehost:main"
lightre-web = "lightre.cli.web:main"

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["workspace"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
lightre = ["resources/*"]
analyzers = ["ghidra_scripts/*.java"]
execution = ["prompts/*.md"]
recovery = ["prompts/*.md"]
rehost = ["workflows/unidbg/*.md", "workflows/unidbg/*.xml"]
webui = ["index.html", "static/*"]
